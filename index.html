<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAuth | Modern Login</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>
<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="grid"></div>
    </div>
    <!-- Main Container -->
    <main class="container">
        <!-- Left Section -->
        <section class="welcome-section">
            <div class="logo">
                <span>&lt;/&gt;</span>
            </div>
            <p class="small-title">WELCOME TO</p>
            <h1>
                Nova<span>Auth</span>
            </h1>
            <p class="description">
                Your simple, secure and smarter way
                to access your digital world.
            </p>
            <div class="features">
                <div class="feature">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div>
                        <h3>Secure</h3>
                        <p>Your data stays protected.</p>
                    </div>
                </div>
                <div class="feature">
                    <i class="fa-solid fa-bolt"></i>
                    <div>
                        <h3>Fast</h3>
                        <p>Quick and seamless access.</p>
                    </div>
                </div>
                <div class="feature">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <div>
                        <h3>Simple</h3>
                        <p>Designed for everyone.</p>
                    </div>
                </div>
            </div>
        </section>
        <!-- Auth Card -->
        <section class="auth-card">
            <div class="card-top">
                <div>
                    <p class="hello" id="helloText">
                        Welcome back 👋
                    </p>
                    <h2 id="formTitle">
                        Sign in
                    </h2>
                </div>
                <div class="lock">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>
            <!-- Toggle -->
            <div class="toggle">
                <button
                    id="loginTab"
                    class="active"
                    onclick="showLogin()"
                >
                    Login
                </button>
                <button
                    id="signupTab"
                    onclick="showSignup()"
                >
                    Sign Up
                </button>
            </div>
            <!-- LOGIN FORM -->
            <form id="loginForm">
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        type="email"
                        placeholder="Email address"
                        required
                    >
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >
                    <i
                        class="fa-regular fa-eye password-eye"
                        onclick="togglePassword('loginPassword', this)"
                    ></i>
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <button class="main-btn" type="submit">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <!-- SIGNUP FORM -->
            <form id="signupForm" class="hidden">
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input
                        type="text"
                        placeholder="Full name"
                        required
                    >
                </div>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        type="email"
                        placeholder="Email address"
                        required
                    >
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        oninput="checkPassword()"
                        required
                    >
                    <i
                        class="fa-regular fa-eye password-eye"
                        onclick="togglePassword('signupPassword', this)"
                    ></i>
                </div>
                <!-- Password Strength -->
                <div class="strength">
                    <div class="strength-bars">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <small id="strengthText">
                        Password strength
                    </small>
                </div>
                <button class="main-btn" type="submit">
                    <span>Create account</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>
            <!-- Social Login -->
            <div class="social-buttons">
                <button>
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>
                <button>
                    <i class="fa-brands fa-github"></i>
                    GitHub
                </button>
            </div>
            <!-- Bottom Text -->
            <p class="bottom-text" id="bottomText">
                Don't have an account?
                <button onclick="showSignup()">
                    Create one
                </button>
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
